<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c050a">
  <title>رسالة ليكي ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="hearts" aria-hidden="true">
    <span>♡</span><span>♥</span><span>♡</span><span>♥</span><span>♡</span><span>♥</span><span>♡</span>
  </div>

  <main class="site">
    <section id="welcome" class="screen active">
      <div class="card intro-card">
        <div class="envelope">💌</div>
        <p class="eyebrow">رسالة خاصة</p>
        <h1>الرسالة دي ليكي إنتي</h1>
        <p class="intro-text">في حاجة نفسي أقولها ليكي من فترة...<br>والمرة دي قررت أقولها بجد ❤️</p>
        <button id="openBtn" class="primary-btn">فتح الرسالة <span>💌</span></button>
      </div>
    </section>

    <section id="letter" class="screen">
      <div class="card letter-card">
        <div class="small-heart">♡</div>
        <p id="typing" class="letter-text"></p>
        <button id="continueBtn" class="primary-btn hidden">كمّلي ❤️</button>
      </div>
    </section>

    <section id="question" class="screen">
      <div class="card question-card">
        <div class="big-heart">❤️</div>
        <p class="eyebrow">دلوقتي القرار ليكي</p>
        <h2>أريني، تحبي ندي للحكاية دي فرصة؟</h2>
        <p class="subtext">اختاري اللي حاساه بجد... ومفيش أي ضغط عليكي 🤍</p>

        <div class="choices">
          <button class="choice yes" data-message="وأنا كمان بحبك ❤️">❤️ وأنا كمان بحبك</button>
          <button class="choice think" data-message="محتاجة وقت أفكر 🤍">🤍 محتاجة وقت أفكر</button>
          <button class="choice no" data-message="لأ، أنا مرتبطة">💔 لأ، أنا مرتبطة</button>
        </div>
      </div>
    </section>

    <section id="result" class="screen">
      <div class="card result-card">
        <div id="resultIcon" class="result-icon">❤️</div>
        <p id="resultEyebrow" class="eyebrow">ردك وصل ❤️</p>
        <h2 id="resultTitle"></h2>
        <p id="resultText" class="result-text"></p>

        <div class="contact-buttons">
          <button id="whatsappBtn" class="contact-btn whatsapp-btn">
            <span class="contact-icon">☏</span>
            <span>ابعتيلي على واتساب</span>
          </button>
          <button id="tiktokBtn" class="contact-btn tiktok-btn">
            <span class="contact-icon">♪</span>
            <span>ابعتيلي على تيك توك</span>
          </button>
        </div>

        <button id="backBtn" class="text-btn">الرجوع للاختيارات</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
